<!-- NEW PANEL: Roof Elements Drawing -->
<div class="panel">
    <h2 class="panel-title">🎨 Tető Elemek</h2>
    
    <div class="element-tools">
        <button class="btn-element" data-type="RIDGE">
            <span class="element-indicator" style="background: #ef4444"></span>
            <div class="element-label">
                <strong>📐 Gerinc</strong>
                <small>1500 Ft/m</small>
            </div>
        </button>
        
        <button class="btn-element" data-type="EAVES">
            <span class="element-indicator" style="background: #10b981"></span>
            <div class="element-label">
                <strong>💧 Ereszvonal</strong>
                <small>3500 Ft/m</small>
            </div>
        </button>
        
        <button class="btn-element" data-type="VALLEY">
            <span class="element-indicator" style="background: #3b82f6"></span>
            <div class="element-label">
                <strong>⚡ Vápa</strong>
                <small>2000 Ft/m</small>
            </div>
        </button>
        
        <button class="btn-element" data-type="HIP">
            <span class="element-indicator" style="background: #f59e0b"></span>
            <div class="element-label">
                <strong>🔶 Kupás él</strong>
                <small>1800 Ft/m</small>
            </div>
        </button>
        
        <button class="btn-element" data-type="CHIMNEY">
            <span class="element-indicator" style="background: #8b5cf6"></span>
            <div class="element-label">
                <strong>🏭 Kémény</strong>
                <small>25000 Ft/db</small>
            </div>
        </button>
    </div>
    
    <div class="element-actions">
        <button id="finish-element-btn" class="btn btn-secondary btn-sm">
            ✓ Befejezés
        </button>
        <button id="clear-elements-btn" class="btn btn-danger btn-sm">
            🗑️ Törlés
        </button>
    </div>
    
    <div id="drawing-tooltip" class="drawing-tooltip" style="display: none;">
        Rajzolás folyamatban...
    </div>
</div>

<!-- NEW PANEL: Elements Summary -->
<div class="panel">
    <h2 class="panel-title">📊 Elemek Összesítése</h2>
    <div id="elements-summary">
        <p class="text-muted">Még nincs elem rajzolva</p>
    </div>
</div>
